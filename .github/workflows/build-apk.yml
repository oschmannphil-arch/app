name: APK bauen

# Baut bei jedem Push eine installierbare Debug-APK und hängt sie an ein GitHub-Release,
# damit man sie direkt am Handy herunterladen kann (Releases-Seite des Repos).
on:
  push:
    branches: [claude/dazzling-hamilton-6czczc, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Das Repo enthält keinen gradlew, daher die Gradle-Version aus gradle-wrapper.properties.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # Logik-Tests (Ausfall-/Klausur-Erkennung). Ein Fehlschlag verhindert die APK nicht,
      # steht aber im Log und im Testbericht.
      - name: Tests
        id: tests
        continue-on-error: true
        run: gradle :app:testDebugUnitTest --no-daemon

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testbericht
          path: app/build/reports/tests/testDebugUnitTest

      # Release statt Debug: Debug-Builds sind bei Compose deutlich langsamer (kein Optimieren,
      # zusätzliche Prüfungen). Für den Alltag immer die Release-APK nehmen.
      - name: Release-APK bauen
        run: gradle :app:assembleRelease --no-daemon

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk NaechsteStunde.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NaechsteStunde-apk
          path: NaechsteStunde.apk

      - name: Release mit APK veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          prerelease: true
          files: NaechsteStunde.apk
          body: |
            Release-APK zum direkten Installieren am Handy.
            Commit: ${{ github.sha }}
